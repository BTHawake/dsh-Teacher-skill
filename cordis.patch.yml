# DSH bundle patch for dsh-teacher-skill.
#
# Install (from this directory):
#   dsh plugin --profile web add link:<this-directory>
# Then restart `dsh web`.
#
# `workspaceRoot` is only a legacy/single-root fallback. Prefer the
# AI-managed registry: ~/.dsh/teacher-workspaces.json
#   { "workspaces": { "操作系统": "D:\\...\\操作系统" } }
# A course at
#   <workspaceRoot>/讲义/<course>/index.html
# is served at
#   /teacher/<workspace>/<course>/index.html
#
# Set `token` when the DSH web server is reachable by untrusted clients.
- insert:
    - id: teacher-course
      name: dsh-teacher-skill
      config:
        enabled: true
        workspaceRoot: ''
        registry: ''
        token: ''
